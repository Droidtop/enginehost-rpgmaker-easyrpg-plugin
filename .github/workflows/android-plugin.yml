name: Build enginehost EasyRPG plugin

on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # plugin-core is deliberately an orphan wrapper changeset: it has no
    # upstream EasyRPG source tree (and therefore no builds/android/gradlew).
    # A real engine line becomes buildable only after this changeset is merged
    # into plugin/<version>, so compile and publish from those branches.
    #
    # Builds and packs the payload. No signing key and no write token here:
    # the dependency downloads, Gradle and its plugins run in this job
    # (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    if: startsWith(github.ref, 'refs/heads/plugin/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: Player
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build autoconf automake libtool pkg-config gperf
      - name: Fetch the official EasyRPG Android dependency build
        run: |
          if [ "$GITHUB_REF_NAME" = "plugin/0.8.1.1" ]; then
            git clone --filter=blob:none https://github.com/EasyRPG/buildscripts.git buildscripts
            git -C buildscripts checkout e94cc5426b186a24b503280588d6757c8334eb1c
          else
            git clone --depth 1 https://github.com/EasyRPG/buildscripts.git buildscripts
          fi
          cd buildscripts/android
          # zlib.net's historical archive endpoint now intermittently returns
          # an HTML response to CI. Use zlib's official GitHub tag archive for
          # the same pinned 1.3.1 source tree instead.
          sed -i 's#https://zlib.net/fossils/zlib-1.3.1.tar.gz#https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz#' ../shared/packages.sh
          # The historical SDL2-era script forces the host assembler. Modern
          # runners do not provide a cross `as`; Clang's integrated assembler
          # is the supported NDK path and accepts the same sources.
          sed -i 's/-no-integrated-as //g' 2_build_toolchain.sh
          for attempt in 1 2 3; do
            if ./1_download_library.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Dependency archive preparation attempt $attempt failed; removing incomplete downloads"
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.zip' \) -delete
          done
          sed -i '/build "ARMeabi-v7a"/d; /build "x86"/d; /build "x86_64"/d' 2_build_toolchain.sh
          for attempt in 1 2 3; do
            if ./2_build_toolchain.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Dependency build attempt $attempt failed; retrying transient upstream downloads"
          done
          PREFIX="$PWD/arm64-v8a-toolchain"
          NDK_DIR="$(find "$PWD/android-sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          git clone --depth 1 --branch 0.8.1 https://github.com/EasyRPG/liblcf.git liblcf
          cmake -S liblcf -B liblcf/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DINIH_LIBRARY="$PREFIX/lib/libinih.a" -DINIH_INCLUDE_DIR="$PREFIX/include" \
            -DICU_ROOT="$PREFIX" -DICU_INCLUDE_DIR="$PREFIX/include" \
            -DICU_I18N_LIBRARY_RELEASE="$PREFIX/lib/libicui18n.a" \
            -DICU_UC_LIBRARY_RELEASE="$PREFIX/lib/libicuuc.a" \
            -DICU_DATA_LIBRARY_RELEASE="$PREFIX/lib/libicudata.a" \
            -DEXPAT_LIBRARY="$PREFIX/lib/libexpat.a" -DEXPAT_INCLUDE_DIR="$PREFIX/include" \
            -DLIBLCF_ENABLE_TOOLS=OFF -DLIBLCF_ENABLE_TESTS=OFF \
            -DLIBLCF_ENABLE_BENCHMARKS=OFF -DLIBLCF_UPDATE_MIMEDB=OFF
          cmake --build liblcf/build --target install --parallel 2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build arm64 plugin APK
        working-directory: Player/builds/android
        env:
          ANDROID_HOME: ${{ github.workspace }}/buildscripts/android/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/buildscripts/android/android-sdk
        run: ./gradlew -PtoolchainDirs="${{ github.workspace }}/buildscripts/android" :app:assembleDebug --stacktrace
      - name: Pack the unsigned bundle inputs
        if: startsWith(github.ref, 'refs/heads/plugin/')
        working-directory: Player
        run: |
          # A long chain of bare `test`s: without tracing, any one of them
          # fails the job silently after a very long native build.
          set -x
          apk="$(find builds/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -f "$apk"
          mkdir -p build/unsigned/payload
          cp "$apk" build/unsigned/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/unsigned/payload
          test -f build/unsigned/payload/classes.dex
          test -n "$(find build/unsigned/payload/lib -type f -name '*.so' -print -quit)"
          # Declare every dex that is actually present, in load order. A
          # lexical sort puts classes10 before classes2, so order numerically.
          python3 - <<'DEXES'
          import json, pathlib, re
          payload = pathlib.Path('build/unsigned/payload')
          def order(p):
              m = re.fullmatch(r'classes(\d*)\.dex', p.name)
              return int(m.group(1) or 1)
          dexes = sorted(payload.glob('classes*.dex'), key=order)
          assert dexes, 'no classes*.dex in the APK payload'
          data = json.loads(pathlib.Path('enginehost/bundle-metadata.json').read_text())
          data['dexFiles'] = [d.name for d in dexes]
          pathlib.Path('build/unsigned/bundle-metadata.json').write_text(json.dumps(data, indent=2) + '\n')
          print('dexFiles =', data['dexFiles'])
          DEXES
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          cp COPYING build/unsigned/payload/COPYING.easyrpg
          cp resources/shinonome/AUTHORS build/unsigned/payload/AUTHORS.shinonome
          cp resources/ttyp0/LICENSE build/unsigned/payload/LICENSE.ttyp0
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-rpgmaker-easyrpg-apk
          path: Player/builds/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/heads/plugin/')
        with:
          name: enginehost-rpgmaker-easyrpg-bundle-unsigned
          path: Player/build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build.
    needs: android
    if: startsWith(github.ref, 'refs/heads/plugin/')
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: enginehost-rpgmaker-easyrpg-bundle-unsigned
      bundle: dev.enginehost.rpgmaker.easyrpg.v1.enginehost.tar.xz
      artifact-name: enginehost-rpgmaker-easyrpg-bundle
      channel: ${{ inputs.channel }}
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-rpgmaker-easyrpg-bundle
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-rpgmaker-easyrpg-bundle
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
